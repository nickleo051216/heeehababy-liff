<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEEEHABABY 日本代購</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" onerror="window.__liffSdkFailed=true"></script>
<style>
:root{--paper:#EFF2ED;--surface:#FFF;--surface-2:#F7F9F6;--ink:#172A22;--ink-2:#4C5F56;--ink-3:#8B9C93;
--line:#DCE2DC;--line-soft:#EAEEE9;--pine:#15564F;--pine-soft:#DDEBE7;--pine-deep:#0E3D38;
--gold:#B87A12;--gold-soft:#FBF0DA;--beni:#A8123C;--beni-soft:#F9E3E9;--tab-h:62px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;
line-height:1.65;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
.phone{width:100%;max-width:412px;background:var(--paper);position:relative;min-height:100vh;
padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 20px);overflow:hidden}
.cap{display:none}
/* 平板（600–859）：沿用手機版面，內容置中加寬 */
@media(min-width:600px) and (max-width:859px){
.phone{max-width:640px}
.tabs{max-width:640px}
.netbar{max-width:640px}}
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);padding:14px 18px 10px;display:flex;
align-items:center;gap:10px;border-bottom:1px solid transparent}
.topbar.stuck{border-bottom-color:var(--line)}
.brand{font-weight:900;letter-spacing:.06em;font-size:15px;color:var(--pine)}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.18em;color:var(--ink-3)}
.topbar .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;
background:var(--surface);border:1px solid var(--line)}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
background:var(--beni);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.badge.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.wrap{padding:0 18px}
.h2{font-size:17px;font-weight:700;margin:22px 0 10px}
.dim{color:var(--ink-3)}.tiny{font-size:12px}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.5}
.pill.pine{background:var(--pine-soft);color:var(--pine-deep)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.beni{background:var(--beni-soft);color:var(--beni)}.pill.grey{background:var(--line-soft);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:12px;
font-weight:700;font-size:14.5px;transition:filter .15s}
.btn:active{filter:brightness(.94)}
.btn.primary{background:var(--pine);color:#fff}
.btn.ghost{background:var(--surface);color:var(--pine);border:1.5px solid var(--pine)}
.btn.quiet{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--beni);border:1px solid var(--beni-soft)}
.btn.sm{padding:9px 14px;font-size:13px}.btn.block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.hr{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;padding:52px 24px}.empty h3{margin:14px 0 6px;font-size:16px}
.empty p{margin:0 0 18px;color:var(--ink-2);font-size:13.5px}
.todo{background:var(--beni);color:#fff;border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:11px;margin-top:4px}
.todo b{font-size:14px}.todo .ar{margin-left:auto;font-size:18px;opacity:.8}
.trip{position:relative;background:var(--pine);color:#fff;border-radius:18px;padding:18px;overflow:hidden;margin-top:12px}
.trip::after{content:"";position:absolute;right:-38px;top:-48px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.055)}
.trip .code{font-size:11.5px;letter-spacing:.22em;color:rgba(255,255,255,.62);font-weight:500}
.trip h1{margin:5px 0 2px;font-size:21px;font-weight:900}
.trip .sub{font-size:13px;color:rgba(255,255,255,.78);margin-bottom:14px}
.count{display:flex;gap:8px;position:relative}
.cbox{background:rgba(255,255,255,.13);border-radius:10px;padding:7px 0;text-align:center;flex:1}
.cbox b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.cbox span{font-size:10.5px;color:rgba(255,255,255,.66)}
.trip .foot{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.82)}
.steps{display:flex;margin:10px 0 2px}.step{flex:1;text-align:center;position:relative}
.step .dot{width:11px;height:11px;border-radius:50%;background:var(--line);margin:0 auto 6px;border:2px solid var(--paper);position:relative;z-index:2}
.step.done .dot{background:var(--pine)}.step.now .dot{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.step::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1}
.step:first-child::before{display:none}.step.done::before{background:var(--pine)}
.step em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.step.done em,.step.now em{color:var(--ink);font-weight:700}
.dk .step .dot{background:rgba(255,255,255,.28);border-color:var(--pine)}
.dk .step::before{background:rgba(255,255,255,.22)}.dk .step.done .dot{background:#fff}
.dk .step.done::before{background:rgba(255,255,255,.75)}
.dk .step.now .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(184,122,18,.35)}
.dk .step em{color:rgba(255,255,255,.5)}.dk .step.done em,.dk .step.now em{color:#fff;font-weight:700}
details.fold{background:var(--surface);border:1px solid var(--line-soft);border-radius:13px;overflow:hidden}
details.fold+details.fold{margin-top:9px}
details.fold>summary{list-style:none;padding:12px 14px;display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px;font-weight:700;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"⌄";margin-left:auto;color:var(--ink-3);font-size:15px;line-height:1;transform:translateY(-2px);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(180deg) translateY(1px)}
details.fold>summary .sumnote{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-3)}
.foldbody{padding:0 14px 14px}
details.dark{margin-top:12px;border-top:1px solid rgba(255,255,255,.16);padding-top:10px}
details.dark>summary{list-style:none;font-size:12.5px;color:rgba(255,255,255,.82);display:flex;align-items:center;cursor:pointer}
details.dark>summary::-webkit-details-marker{display:none}
details.dark>summary::after{content:"⌄";margin-left:auto;transition:transform .2s}
details.dark[open]>summary::after{transform:rotate(180deg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.inner{padding:2px 0;margin:0}
.chip{white-space:nowrap;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:700}
.seg{display:grid;grid-auto-flow:column;background:var(--line-soft);border-radius:11px;padding:3px;gap:3px}
.seg button{padding:8px 0;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--pine);font-weight:700;box-shadow:0 1px 2px rgba(23,42,34,.08)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
border-radius:11px;padding:9px 12px;margin-bottom:10px}
.search input{border:none;outline:none;flex:1;background:none;font-size:14px;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line-soft);display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;background:var(--surface-2);position:relative;display:grid;place-items:center;font-size:40px;border-bottom:1px solid var(--line-soft)}
.thumb .flag{position:absolute;top:7px;left:7px}.thumb.out{filter:grayscale(1) opacity(.55)}
.cbody{padding:9px 10px 11px;display:flex;flex-direction:column;flex:1}
.cname{font-size:13px;line-height:1.45;font-weight:500;min-height:38px}
.cbrand{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:2px}
.price .twd{font-size:17px;font-weight:900;color:var(--pine-deep)}
.price .note{display:block;font-size:10.5px;color:var(--ink-3)}
.addbtn{margin-top:9px;width:100%;padding:8px 0;border-radius:9px;background:var(--pine-soft);color:var(--pine-deep);font-weight:700;font-size:13px}
.addbtn.out{background:var(--line-soft);color:var(--ink-3)}
.addbtn.notify{background:var(--gold-soft);color:var(--gold)}
.stockbar{height:3px;background:var(--line-soft);border-radius:2px;margin-top:8px;overflow:hidden}
.stockbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.list{background:var(--surface);border-radius:14px;border:1px solid var(--line-soft);overflow:hidden}
.item{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:none}
.item .ph{width:56px;height:56px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:13.5px;font-weight:500;line-height:1.45}
.qty{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:29px;font-size:16px;font-weight:700;color:var(--pine);background:var(--surface-2)}
.qty span{width:32px;text-align:center;font-size:13.5px;font-weight:700;line-height:29px}
.linkred{color:var(--beni);font-size:12px;font-weight:500}
.link{color:var(--pine);font-size:12.5px;font-weight:700}
.sumbox{background:var(--surface);border-radius:14px;border:1px solid var(--line-soft);padding:14px}
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--ink-2);gap:10px}
.sumrow.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:11px;color:var(--ink);font-weight:900;font-size:16px}
.sumrow .hint{font-size:11px;color:var(--ink-3);font-weight:400}
details.order{background:var(--surface);border-radius:14px;border:1px solid var(--line-soft);margin-bottom:11px;overflow:hidden}
details.order>summary{list-style:none;padding:14px;cursor:pointer}
details.order>summary::-webkit-details-marker{display:none}
.obody{padding:0 14px 14px}
.oid{font-size:11.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:500}
.tlrow{display:flex;gap:11px;position:relative;padding-bottom:14px}
.tlrow:last-child{padding-bottom:0}
.tlrow::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.tlrow:last-child::before{display:none}.tlrow.done::before{background:var(--pine)}
.tldot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none;margin-top:3px;z-index:2}
.tlrow.done .tldot{background:var(--pine)}
.tlrow.now .tldot{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.tl b{font-size:13.5px;font-weight:700;display:block}.tl span{font-size:11.5px;color:var(--ink-3)}
.tlrow.todo b{color:var(--ink-3);font-weight:500}
.ship{background:var(--surface-2);border-radius:11px;padding:11px 12px;margin-top:9px;border-left:3px solid var(--pine)}
.ship.warn{border-left-color:var(--gold)}
.alert{border-radius:11px;padding:11px 12px;font-size:12.5px;line-height:1.6;margin-top:10px}
.alert.beni{background:var(--beni-soft);color:#7C0E2C}.alert.gold{background:var(--gold-soft);color:#7A4F08}
.alert.pine{background:var(--pine-soft);color:var(--pine-deep)}
.drop{border:1.5px dashed var(--line);border-radius:13px;padding:20px 16px;text-align:center;background:var(--surface);color:var(--ink-2)}
.drop b{display:block;font-size:14px;color:var(--ink);margin-bottom:3px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
.trackrow{display:flex;gap:11px;position:relative;padding-bottom:16px}
.trackrow:last-child{padding-bottom:0}
.trackrow::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.trackrow:last-child::before{display:none}
.trackrow.done::before{background:var(--pine)}
.trackdot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none;margin-top:3px;z-index:2}
.trackrow.done .trackdot{background:var(--pine)}
.trackrow.now .trackdot{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.wishbar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.wishbtn{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 6px;text-align:center;
font-size:12.5px;font-weight:700;color:var(--pine-deep);line-height:1.5}
.wishbtn em{display:block;font-style:normal;font-size:21px;margin-bottom:3px}
.wish{background:var(--surface);border:1px solid var(--line-soft);border-radius:13px;padding:13px 14px;margin-bottom:10px}
.wish .pv{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line-soft)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.field textarea{resize:vertical;min-height:66px}
.field .ro{cursor:pointer;background:var(--surface-2)}
.field .err{border-color:var(--beni)}
.errmsg{color:var(--beni);font-size:11.5px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{border:1.5px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center;font-size:13px;font-weight:500;background:var(--surface);line-height:1.45}
.opt.on{border-color:var(--pine);background:var(--pine-soft);color:var(--pine-deep);font-weight:700}
.store{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left;align-items:center}
.store:last-child{border-bottom:none}.store.on{background:var(--pine-soft)}
.store .lg{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:900;color:#fff;flex:none;line-height:1.1;text-align:center}
.profile{background:var(--surface);border-radius:16px;border:1px solid var(--line-soft);padding:16px;display:flex;gap:13px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;background:var(--pine-soft);display:grid;place-items:center;font-size:22px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:900;color:var(--pine-deep);line-height:1.3}
.stat span{font-size:11px;color:var(--ink-3)}
.menu{background:var(--surface);border-radius:14px;border:1px solid var(--line-soft);overflow:hidden;margin-top:12px}
.mrow{display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left;font-size:14px}
.mrow:last-child{border-bottom:none}.mrow .ar{margin-left:auto;color:var(--ink-3);font-size:15px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none;margin-left:auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sw.on{background:var(--pine)}.sw.on::after{transform:translateX(18px)}
.upmeta{background:var(--surface-2);border-radius:10px;padding:9px 11px;margin-top:9px;font-size:11.5px;line-height:1.9}
.upmeta .between{gap:14px}
.upmeta .ell{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.sharebtn{width:100%;margin-top:12px;padding:10px;border-radius:11px;background:rgba(255,255,255,.16);
color:#fff;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.sharebtn:active{background:rgba(255,255,255,.26)}
.payopt{width:100%;display:flex;align-items:center;gap:11px;background:var(--surface);
border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px;text-align:left}
.payopt.on{border-color:var(--pine);background:var(--pine-soft)}
.payopt .pe{font-size:21px;flex:none}
.payopt b{font-size:14px;font-weight:700}
.radio{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.radio.on{border-color:var(--pine)}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--pine)}
.invbox{background:var(--surface-2);border-radius:11px;padding:11px 12px;margin-top:10px;border-left:3px solid var(--pine)}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ecard{background:var(--surface);border:1px solid var(--line-soft);border-radius:15px;padding:15px 13px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ecard.hot{border-color:var(--beni);background:var(--beni-soft)}
.ecard em{font-style:normal;font-size:24px;margin-bottom:4px}
.ecard b{font-size:14.5px;font-weight:700}
.ecard span{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.ecard.hot span{color:#7C0E2C}
.livebar{width:100%;display:flex;align-items:center;gap:10px;background:var(--beni);color:#fff;
border-radius:14px;padding:12px 15px;margin-top:4px}
.livebar .ar{font-size:18px;opacity:.8}
.ldot{width:9px;height:9px;border-radius:50%;background:#fff;flex:none;
box-shadow:0 0 0 0 rgba(255,255,255,.65);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.livehero{background:var(--beni);color:#fff;border-radius:18px;padding:16px 18px;position:relative;overflow:hidden}
.livehero::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06)}
.livehero .cbox{background:rgba(255,255,255,.15)}
.livecard{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.livecard.sold{opacity:.62}
.lno{background:var(--ink);color:#fff;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:900;
letter-spacing:.04em;flex:none;align-self:flex-start}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:412px;height:var(--tab-h);
background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
z-index:40;padding-bottom:env(safe-area-inset-bottom)}

.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500;position:relative}
.tab.on{color:var(--pine);font-weight:700}.tab svg{width:21px;height:21px}
.tab .badge{top:6px;right:calc(50% - 20px)}
.lb{position:fixed;inset:0;background:rgba(8,16,12,.94);z-index:80;display:none;
place-items:center;padding:20px;cursor:zoom-out}
.lb.show{display:grid}
.lb img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;

<script>
/* ===========================================================================
   HEEEHABABY 買家前台（LINE LIFF）
   名詞與訂單狀態依系統規格：團 / 願望清單 / 拆單 / 狀態機
   ---------------------------------------------------------------------------
   ★ 後端接點：見 japan-system 的 BUYER_API_CONTRACT.md（/api/v1/{resource}/{action}，27 個，含公開的 /health）
     前端不直連資料庫、不持有金鑰；身分一律送 LIFF ID token，由後端驗證。
     本前台獨立部署於 japan-front-end-system，/api/v1/* 由 vercel.json 反向代理到後端，
     瀏覽器看到的是同網域，不需要 CORS。
   ★ 門市資料：正式版改接超商電子地圖 API（7-11 OpenPoint / 全家 FamiPort），
     本檔內建全台縣市鄉鎮清單與門市索引作為離線後備。
   =========================================================================== */
/* 價目表（price_table）：日幣「税込」金額 → 台幣售價，級距對照，非匯率換算。
   超出最大級距者需個別報價。盒裝／大型物品另加 NT$30~50。 */
var PRICE_TABLE = [[429,180],[539,220],[649,250],[869,330],[979,350],[1089,400],
                   [1309,490],[1419,530],[1639,600],[1969,700],[2519,890]];
var BULKY_ADD = [30,50];
function twdOf(jpyTaxed){
  for(const [j,t] of PRICE_TABLE) if(jpyTaxed<=j) return t;
  return null;                       // 超出級距 → 需人工報價
}
function tierOf(jpyTaxed){
  for(let i=0;i<PRICE_TABLE.length;i++) if(jpyTaxed<=PRICE_TABLE[i][0])
    return {lo:i?PRICE_TABLE[i-1][0]+1:0, hi:PRICE_TABLE[i][0], twd:PRICE_TABLE[i][1]};
  return null;
}
/* 圖片上傳規則 —— 檔名格式沿用 ocr_pending.drive_file_name：
   {prefix}_{LINE userId 末 8 碼}_{yyyyMMddHHmmssS}.{ext}
   四個用途各自存到 settings 裡對應的 Drive 資料夾 */
var UPLOAD = {
  image  :{prefix:"ocr_temp", folder:"drive_folder_ocr_temp", label:"圖片暫存區",   ttl:"15 分鐘後自動清除"},
  order  :{prefix:"order",    folder:"drive_folder_orders",   label:"下單圖片",     ttl:"長期保存"},
  wish   :{prefix:"wish",     folder:"drive_folder_wishlist", label:"許願圖片",     ttl:"長期保存"},
  payment:{prefix:"pay",      folder:"drive_folder_payment",  label:"對帳截圖",     ttl:"長期保存"}
};
var UP_MAX_MB = 10;
var UP_TYPES = ["image/jpeg","image/png","image/webp","image/heic","image/heif"];

function uid8(){ return (DB.me.userId||"").slice(-8); }
function stamp(){
  const d=new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${Math.floor(d.getMilliseconds()/100)}`;
}
function extOf(f){
  const m=(f.name||"").match(/\.([A-Za-z0-9]+)$/);
  const e=(m?m[1]:"jpg").toLowerCase();
  return (e==="jpeg"?"jpg":e==="heif"?"heic":e);
}
/* 產生系統檔名 */
function sysName(kind,f){ return `${UPLOAD[kind].prefix}_${uid8()}_${stamp()}.${extOf(f)}`; }
/* 上傳前檢查：型別與大小 */
function checkFile(f){
  if(!f) return "沒有選到檔案";
  if(UP_TYPES.indexOf(f.type)<0 && !/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name))
    return "只接受 JPG／PNG／WEBP／HEIC 圖片";
  if(f.size > UP_MAX_MB*1024*1024) return `圖片超過 ${UP_MAX_MB}MB，請壓縮後再傳`;
  return null;
}
/* 上傳前壓縮：長邊 1600px、JPEG。整個請求要在 Vercel 的上限內（後端要求 3MB 以下），
   超過時 Vercel 在請求到後端之前就擋掉，錯誤訊息看不出原因。回傳 data URL。 */
var UP_SEND_MAX = 3*1024*1024;
function shrinkImage(f){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(f), img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url);
      const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      for(const q of [0.8,0.65,0.5]){ const d=c.toDataURL("image/jpeg",q); if(d.length<UP_SEND_MAX) return res(d); }
      rej(new Error("照片太大，請換一張或先裁切"));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("這張照片無法讀取，請改用 JPG 或 PNG")); };
    img.src=url;
  });
}
const jpgName = n => n.replace(/\.[a-z0-9]+$/i,".jpg");

/* 後端給的圖片是 15 分鐘就失效的簽名網址。圖片載入失敗時重拉購物車與許願換新網址，
   一分鐘最多一次，避免壞圖一直觸發。 */
var IMG_REFRESH={at:0,busy:false};
function imgExpired(){
  if(CFG.mock||IMG_REFRESH.busy||Date.now()-IMG_REFRESH.at<60000) return;
  IMG_REFRESH.busy=true; IMG_REFRESH.at=Date.now();
  Promise.all([req("/cart/list"),req("/wishes/list")]).then(([cart,wishes])=>{
    (cart||[]).forEach(c=>{ const l=S.cart.find(x=>x.cid===c.cart_id); if(l&&c.image_url) l.img=c.image_url; });
    (wishes||[]).forEach(w=>{ const x=DB.wishes.find(y=>y.id===w.wish_id); if(x&&w.picture) x.img=w.picture; });
    render();
  }).catch(()=>{}).finally(()=>{ IMG_REFRESH.busy=false; });
}

/* 上傳資訊卡（原始檔名、存放位置、大小）。系統檔名含會員識別碼，不給客人看 */
function upInfo(kind,f,name){
  const u=UPLOAD[kind];
  return `<div class="upmeta">
    <div class="between"><span class="dim">原始檔名</span><span class="ell">${esc(f.name)}</span></div>
    <div class="between"><span class="dim">存放位置</span><span>${u.label}</span></div>
    <div class="between"><span class="dim">檔案大小</span><span>${(f.size/1024).toFixed(0)} KB</span></div>
  </div>`;
}

/* 金流方式 —— 前端只送「選了哪一種」，所有金鑰與簽章都在後端，前端不持有 */
var PAYWAY = {
  credit :{t:"信用卡",      e:"💳", d:"一次付清，刷卡後立即完成",       fee:"", flow:"redirect"},
  atm    :{t:"ATM 虛擬帳號", e:"🏧", d:"取得專屬帳號，臨櫃或網銀轉帳",   fee:"", flow:"vacc"},
  bank   :{t:"銀行轉帳",     e:"🏦", d:"轉帳後回報後五碼，人工核對",     fee:"", flow:"manual"}
};
/* 發票開立狀態 */
var INV_ST = { pending:{t:"待開立",c:"grey"}, issued:{t:"已開立",c:"pine"},
               void:{t:"已作廢",c:"beni"}, allowance:{t:"已折讓",c:"gold"} };

var SHOP = { name:"HEEEHABABY", bankName:"華南銀行", bankCode:"008", bankHolder:"",
             bankAccount:"000000000000", payDeadlineDays:2 };
var FX = { cvs:70, home:120 };

/* =========================================================================
   資料層 — 前端唯一對外出口。CFG.mock=true 走本機假資料，false 走後端 japan-system（/api/v1）。
   身分一律送 LIFF idToken，前端不自行傳 userId。
   ========================================================================= */
var CFG = {
  liffId : "2011699944-c5n725TF",
  base   : "/api/v1",   // 由 vercel.json rewrites 代理到後端 japan-system，瀏覽器視為同網域
  mock   : false,       // true = 示範模式（本機假資料，不連後端）
  timeout: 12000,       // 單次請求逾時（ms）
  pollMs : 4000,        // 拍照辨識完成後的輪詢間隔（後端無推播管線，改由前台輪詢 /cart/list）
  pollMax: 40,          // 最多輪詢次數（約 2.5 分鐘；n8n 每分鐘才領一次工作）
  retry  : 2            // 僅對網路錯誤與 5xx 重試
};
var AUTH = { idToken:null, ready:false };
var NET  = { busy:0, lastError:null };

function uuid(){ return "k"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* 低階請求：逾時、重試、冪等鍵、拆 {ok,data,error} 信封
   合約：BUYER_API_CONTRACT.md（與 japan-system I-02 一致） */
async function req(path,{method="GET",body=null,idem=null,retry=CFG.retry}={}){
  if(CFG.mock) return mockApi(path,method,body);
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),CFG.timeout);
  const headers={"Content-Type":"application/json"};
  if(AUTH.idToken) headers["Authorization"]="Bearer "+AUTH.idToken;
  if(idem) headers["Idempotency-Key"]=idem;
  try{
    const res=await fetch(CFG.base+path,{method,headers,
      body:body?JSON.stringify(body):undefined,signal:ctl.signal});
    clearTimeout(timer);
    let env=null; try{ env=await res.json(); }catch(_){}
    if(env&&env.ok===true) return env.data;
    const code=env&&env.error&&env.error.code || (res.status===401?"UNAUTHENTICATED":res.status>=500?"INTERNAL":"ERROR");
    const msg =env&&env.error&&env.error.message || (res.status>=500?"系統忙碌中，稍後再試":"請求無法完成");
    if(res.status===401) AUTH.ready=false;
    throw new ApiErr(code,msg,{status:res.status});
  }catch(e){
    clearTimeout(timer);
    const st=e&&e.data&&e.data.status;
    const retriable = !(e instanceof ApiErr) || st>=500;     // 只重試網路錯誤與 5xx
    if(retriable && retry>0){ await wait(600*(CFG.retry-retry+1)); return req(path,{method,body,idem,retry:retry-1}); }
    throw (e instanceof ApiErr)?e:new ApiErr("NET","連線不穩，請稍後再試");
  }
}
function ApiErr(code,message,data){ this.code=code; this.message=message; this.data=data||null; }
ApiErr.prototype=Object.create(Error.prototype);

/* 包一層：顯示 loading、統一錯誤提示 */
async function call(path,opt,label){
  NET.busy++; paintNet();
  try{ const r=await req(path,opt); NET.lastError=null; return r; }
  catch(e){ NET.lastError=e; toast((label?label+"：":"")+e.message,2800); throw e; }
  finally{ NET.busy--; paintNet(); }
}

}

/* 拍照下單：後端辨識完成後不推播，由前台輪詢 /cart/list 取回結果 */
var POLLS={};
function stopPoll(cid){ if(POLLS[cid]){ clearTimeout(POLLS[cid].t); delete POLLS[cid]; } }
function pollOcr(cid,line){
  if(CFG.mock||!cid) return;                       // 示範模式由本機流程直接補上結果
  stopPoll(cid);
  const st={n:0,t:null}; POLLS[cid]=st;
  const tick=async()=>{
    if(POLLS[cid]!==st) return;
    if(document.hidden){ st.t=setTimeout(tick,CFG.pollMs); return; }   // 切到背景時不浪費流量
    st.n++;
    if(st.n>CFG.pollMax){                          // 超時：不再等，讓客人自己補
      stopPoll(cid);
      if(line&&line.p==null){ line.note="辨識較久，可先自行填寫名稱與價格"; render(); }
      return;
    }
    try{
      const list=await API.cartList();
      const c=(list||[]).find(x=>x.cart_id===cid);
      if(!c){ stopPoll(cid); return; }             // 已被移除或已下單
      // 後端的 ocr_done 才是準的：辨識失敗時價格是 null、信心度是 low，但已經結束了。
      // 舊後端沒有這個欄位時才退回舊判定。
      const done = c.ocr_done!=null ? c.ocr_done===true : (c.price_twd!=null||c.ai_confidence!=="low");
      if(done){
        const l=S.cart.find(x=>x.cid===cid);
        if(l){ const m=M.cart(c); Object.assign(l,m,{k:l.k,img:l.img||m.img}); }
        stopPoll(cid); render();
        toast(c.price_twd!=null?"辨識完成，請確認商品與價格":"無法辨識金額，請自行填寫名稱與價格",2600);
        return;
      }
    }catch(e){ /* 單次失敗不中斷，下一輪再試 */ }
    st.t=setTimeout(tick,CFG.pollMs);
  };
  st.t=setTimeout(tick,CFG.pollMs);
}

/* =========================================================================
   執行環境 — 同一套程式碼跑兩種情境
     ENV.inClient=true   在 LINE 內：自動登入 + 分享／掃碼／送訊息
     ENV.inClient=false  外部瀏覽器：LINE Login 導轉，額外功能優雅降級
   ========================================================================= */
var ENV = { sdk:false, inClient:false, os:"", ver:"", lang:"", ready:false };
const hasLiff = ()=> typeof liff!=="undefined" && !window.__liffSdkFailed;
/* 功能可用性判斷，一律先問再用 */
function can(feature){
  if(CFG.mock) return true;
  if(!ENV.sdk||!ENV.inClient) return false;
  try{ return liff.isApiAvailable(feature); }catch(e){ return false; }
}

async function initLiff(){
  if(CFG.mock){ AUTH.ready=true; ENV.ready=true; ENV.inClient=true; routeDeepLink(); return true; }
  if(!hasLiff()){ toast("無法載入 LINE SDK，請確認網路後重新開啟",3200); return false; }
  try{
    await liff.init({liffId:CFG.liffId});
    ENV.sdk=true;
    ENV.inClient=liff.isInClient();
    ENV.os=liff.getOS(); ENV.ver=liff.getVersion(); ENV.lang=liff.getLanguage();
    if(!liff.isLoggedIn()){ liff.login({redirectUri:cleanHref()}); return false; }
    AUTH.idToken=liff.getIDToken();
    if(!AUTH.idToken){                              // LIFF 沒開 openid 權限時會是 null，之後每支 API 都 401
      toast("LINE 登入資訊不完整，請稍後再試或聯絡官方客服",3200); loadFailed(); return false;
    }
    AUTH.ready=true; ENV.ready=true;
    routeDeepLink();
    cleanLoginParams();
    return true;
  }catch(e){
    toast("LINE 登入失敗："+(e&&e.message||"未知錯誤"),3200);
    return false;
  }
}
/* LINE 登入完成後，網址會帶回一次性的授權碼等參數（code、state…）。
   授權碼已經被 LIFF 用掉、也只能用一次，但留在網址列上不好看，客人分享或截圖時也會一起帶出去，
   所以登入完成後就拿掉，只保留 ?path= 這類自己的參數。 */
var LOGIN_PARAMS=["code","state","friendship_status_changed","liffClientId","liffRedirectUri","liff.state","error","error_description"];
function cleanHref(){
  try{
    const u=new URL(location.href);
    LOGIN_PARAMS.forEach(k=>u.searchParams.delete(k));
    return u.origin+u.pathname+(u.searchParams.toString()?"?"+u.searchParams.toString():"")+u.hash;
  }catch(_){ return location.origin+location.pathname; }
}
function cleanLoginParams(){
  try{ const c=cleanHref(); if(c!==location.href) history.replaceState(history.state,"",c); }catch(_){}
}

/* Deep Link：推播訊息可帶 ?path=orders 直接開到指定頁
   例：https://liff.line.me/{liffId}?path=orders&id=ORD-260901-014 */
function routeDeepLink(){
  let qs=location.search;
  try{ if(ENV.sdk&&liff.state) qs=liff.state; }catch(e){}
  const p=new URLSearchParams(qs);
  const path=p.get("path"), id=p.get("id");
  if(!path) return;
  if(["home","live","wish","cart","orders","me"].indexOf(path)>=0) S.tab=path;
  if(path==="orders"&&id){ S.open.add(id); S.oFilter="live"; }
  if(path==="stmt"){ S.tab="orders"; S.oFilter="stmt"; }
}

function storesOf(city,d){
  const full=districtName(city,d), base=hash(city+d), out=[];
  const n=3+base%2;
  for(let i=0;i<n;i++){
    const b = i%2===0 ? "7-11" : "全家";

      id:String(100000+(base+i*331)%899999),
      a:`${city}${full}${road}路${1+(base+i*13)%300}號`, city, dist:full });
  }

}

function doDrop(k){

  toast(`已取消喊單・棄單紀錄 ${DB.me.drops} / 3`,2600);

    .then(r=>{ if(r&&typeof r.shout_drops==="number"){ DB.me.drops=r.shout_drops; render(); } })
    .catch(()=>{ if(li)li.left-=l.q; DB.me.drops--; S.cart.push(l); syncBadge(); render(); });}

/* ---------- 連線喊單 ---------- */
async function shout(no,n,confirmed){
  n=n||1;
  if(!confirmed&&!DB.me.shoutAck){ return shoutAck(no,n); }
  const it=DB.broadcast.find(x=>x.no===no);
  if(!it)return;
  if(it.left<=0){ return waitlist(no); }
  /* 數量由伺服端原子判定，前端不自行決定成敗 */
  let take, left;
  try{
    var r=await API.shout(no,n);
    take=r.granted; left=r.remaining;
  }catch(e){
    if(e.code==="SOLD_OUT"){ it.left=0; render(); return waitlist(no); }
    if(e.code==="DEADLINE_PASSED"){ it.deadline="已截止"; render(); return; }
    if(e.code==="SUSPENDED"){ DB.me.drops=Math.max(DB.me.drops,3); render(); return; }
    return;                                     // 其他錯誤已提示，不動狀態
  }
  if(!take){ it.left=0; render(); return waitlist(no); }
  it.left=left;
  const l=line("broadcast",no);
  const cid=r.cart_item&&r.cart_item.cart_id;
  if(l){ l.q+=take; l.max=l.q+it.left; if(cid) l.cid=cid; }
  else S.cart.push({k:"L"+no,cid,src:"broadcast",ref:no,n:it.n,e:it.e,p:it.p,jpy:it.jpy,q:take,
                    max:take+it.left,conf:"high",st:"confirmed",note:it.note||""});
  syncBadge(true);
  const rank=it.qty-it.left;
  toast(take<n?`只剩 ${take} 份，已幫你喊到 ${take} 份`:`喊到了！你是第 ${rank} 位・${it.left?"還剩 "+it.left+" 份":"已搶完"}`,2400);
  echoToChat(`✅ 已喊單　${it.no}　${it.n} ×${take}　NT$${nf(it.p*take)}`);
  render();
}
function shoutAck(no,n){
  const it=DB.broadcast.find(x=>x.no===no);
  openSheet("喊單前先確認",`
    <div class="alert beni" style="margin-top:0">
      <b>喊單＝確定購買</b><br>連線商品是小幫手在現場替你拿下的實體商品，喊了就會被結進帳，不是先放著看看。</div>
    <div class="list" style="margin-top:12px"><div class="item">
      <div class="ph">${it.e}</div><div class="info"><b>${it.no}　${esc(it.n)}</b>
        <div class="sm" style="font-weight:900;color:var(--pine-deep);margin-top:3px">NT$${nf(it.p)} × ${n}</div></div></div></div>
    <div class="sm" style="color:var(--ink-2);line-height:1.9;margin-top:12px">
      ・喊到就佔掉現場名額，其他人不能再喊<br>
      ・要取消請在連線結束前處理，會列入棄單紀錄<br>
      ・連線結束後 30 分鐘內未結帳，名額自動釋出並記一次棄單</div>
    <label class="row" style="margin-top:14px;cursor:pointer">
      <input type="checkbox" id="ackbox"><span class="sm">我知道了，之後不用再提醒</span></label>`,
    `<button class="btn primary block" onclick="doAck('${no}',${n})">我確定要買・喊單</button>
     <button class="btn quiet block" style="margin-top:8px" onclick="closeSheet()">再想一下</button>`);

function waitlist(no){

/* 正式模式結帳：等後端成立訂單才顯示，單號、金額與運費都以後端為準，
   不先放一張本機編號的假單（那個編號還會被傳進 LINE 聊天室）。 */
var CHECKING_OUT=false;
async function checkoutLive(C){
  if(CHECKING_OUT) return;
  if(C.some(l=>!l.cid)){ toast("購物車還在同步，請稍候再送出"); return; }
  CHECKING_OUT=true;
  try{
    const r=await API.checkout({cart_ids:C.map(l=>l.cid),pickup:{type:S.pick},
      invoice:{type:S.inv,carrier:DB.me.carrier,tax_id:S.taxId},note:S.note});
    const o=M.order(r);
    DB.orders.unshift(o);
    S.cart=S.cart.filter(l=>C.indexOf(l)<0); S.note="";
    S.open.add(o.id); S.oFilter="live";
    closeSheet(); syncBadge(); go("orders");
    toast(`訂單 ${o.id} 已送出，小幫手確認後計入對帳單`,2800);
    echoToChat(`🧾 已送出訂單 ${o.id}　共 ${o.items.length} 項　NT$${nf(o.total)}`);
  }catch(e){ /* call() 已提示原因，購物車保持原樣 */ }
  finally{ CHECKING_OUT=false; }
}

var _wishFile=null, _wishRaw=null;
function wishPhoto(ev){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const err=checkFile(f); if(err){ toast(err); ev.target.value=""; return; }
  _wishFile=sysName("wish",f); _wishRaw=f;
  const r=new FileReader();
  r.onload=e=>{_wishImg=e.target.result;
    $("#wpv").innerHTML=`<div class="row" style="margin-top:12px">
      <img class="zoomable" src="${_wishImg}" onclick="lightbox('img',this.src,'許願圖片')"
        style="width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">
      <div class="sm" style="min-width:0"><b>已選擇</b>
        <div class="tiny dim">送出後開始辨識</div></div></div>
      ${upInfo("wish",f,_wishFile)}`;};
  r.readAsDataURL(f);
}
async function submitWish(kind){
  const src=kind==="photo"?(_wishImg?"（照片）":null):($("#wsrc")&&$("#wsrc").value.trim());
  if(!src){toast(kind==="photo"?"請先選擇一張照片":"請先填寫內容");return;}
  if(kind==="link"&&!/^https?:\/\//.test(src)){toast("請貼上完整網址，需以 http(s):// 開頭");return;}
  const q=Math.max(1,parseInt($("#wq").value||"1",10)),note=$("#wn").value.trim();
  const w={id:"W-"+(105+DB.wishes.length),src:{photo:"照片",link:"連結",text:"文字"}[kind],
    title:kind==="link"?"辨識中的商品連結":kind==="text"?src.slice(0,28):"辨識中的商品照片",
    raw:src,note,qty:q,st:"parsing",at:now().split(" ")[0],img:kind==="photo"?_wishImg:null,
    file:kind==="photo"?_wishFile:null};
  let data=kind==="photo"?w.img:undefined;
  if(kind==="photo"&&!CFG.mock){
    try{ data=await shrinkImage(_wishRaw); w.file=jpgName(w.file); }
    catch(e){ toast(e.message); return; }
  }
  DB.wishes.unshift(w);_wishImg=null;_wishFile=null;_wishRaw=null;closeSheet();go("wish");
  toast(CFG.mock?"許願已送出，辨識中…":"許願已送出，小幫手報價後會通知你");
  API.wishCreate({src:kind,item_name:kind==="text"?src:undefined,ref_url:kind==="link"?src:undefined,
      quantity:q,note,file_name:w.file,data})
    .then(r=>{ if(r&&r.wish_id){ w.id=r.wish_id; if(!CFG.mock) w.title=r.item_name; } })
    .catch(()=>{ DB.wishes=DB.wishes.filter(x=>x!==w); render(); });
  if(!CFG.mock) return;                             // 正式模式由店家在後台報價，不模擬
  await wait(4000);
  const guess=["日本限定 貝親 寬口奶瓶配件組","西松屋 純棉包巾 兩入","和光堂 嬰兒米精 袋裝","Richell 吸管訓練杯 200ml"];
  w.title=kind==="text"?src:guess[Math.floor(Math.random()*guess.length)];
  w.st="quoted";w.quote=Math.round((380+Math.random()*1600)/10)*10;
  syncBadge();if(S.tab==="wish")render();
  toast(`${w.id} 已完成報價：NT$${nf(w.quote)} / 件`,2800);
}
function wishToCart(id){
  const w=DB.wishes.find(x=>x.id===id);if(!w||w.st!=="quoted")return;
  if(line("wish",id)){toast("這筆許願已經在購物車了");return go("cart");}
  const wl={k:"W"+id,src:"wish",ref:id,n:w.title,e:"⭐",p:w.quote,jpy:null,q:w.qty,max:99,conf:"high",st:"confirmed",img:w.img||null};
  S.cart.push(wl);
  w.st="converted";w.orderId="（購物車）";syncBadge(true);go("cart");
  API.wishToCart(id).then(r=>{ if(r&&r.cart_item) wl.cid=r.cart_item.cart_id; })
    .catch(()=>{ S.cart=S.cart.filter(x=>x!==wl); w.st="quoted"; w.orderId=null; syncBadge(); render(); });
  toast("已加入購物車，可與其他商品一起結帳");}

function wishKeep(id){const w=DB.wishes.find(x=>x.id===id),prev=w.st;w.st="kept";render();toast("已保留至下一團，開團時會通知你");
  API.wishKeep(id).catch(()=>{ w.st=prev; render(); });}
function wishDrop(id){const w=DB.wishes.find(x=>x.id===id);DB.wishes=DB.wishes.filter(x=>x.id!==id);syncBadge();render();toast("已刪除此筆許願");
  API.wishRemove(id).catch(()=>{ DB.wishes.push(w); syncBadge(); render(); });}

function tripLeftTxt(){

  if(d<=0) return "已截止";
  return `${Math.floor(d/864e5)} 天 ${pad(Math.floor(d/36e5)%24)}:${pad(Math.floor(d/6e4)%60)}`;
}
function tripCount(){
  const d=TRIP.closeAt-new Date();
  const dd=Math.max(0,Math.floor(d/864e5)),hh=Math.max(0,Math.floor(d/36e5)%24),
        mm=Math.max(0,Math.floor(d/6e4)%60),ss=Math.max(0,Math.floor(d/1e3)%60);
  return `<div class="cbox"><b>${dd}</b><span>天</span></div>
    <div class="cbox"><b>${pad(hh)}</b><span>時</span></div>
    <div class="cbox"><b>${pad(mm)}</b><span>分</span></div>
    <div class="cbox"><b>${pad(ss)}</b><span>秒</span></div>
    <div class="cbox" style="flex:1.5"><b>${TRIP.joined}</b><span>人已下單</span></div>`;
}

function bcCard(it){
  const l=line("broadcast",it.no), got=l?l.q:0, wl=DB.me.waitlist.indexOf(it.no)>=0;
  const pct=Math.round((it.qty-it.left)/it.qty*100);
  return `<div class="livecard ${it.left===0?"sold":""}">
    <div class="row" style="align-items:flex-start">
      <div class="lno">${it.no.split("-").pop()}</div>
      <div class="zoomable" style="width:56px;height:56px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:26px;flex:none"
        onclick="lightbox('emoji','${jsq(it.e)}','${jsq(it.n)}')">${it.e}</div>
      <div style="flex:1;min-width:0">
        <b class="sm" style="font-weight:700;line-height:1.45;display:block">${esc(it.n)}</b>
        ${it.note?`<div class="tiny dim">${esc(it.note)}</div>`:""}
        <div class="row" style="gap:6px;margin-top:3px">
          <span style="font-weight:900;color:var(--pine-deep);font-size:17px">NT$${nf(it.p)}</span>
          <span class="tiny dim">税込 ¥${nf(it.jpy)}</span>
          ${it.hot?`<span class="pill beni">熱門</span>`:""}</div>
        <div class="tiny" style="color:var(--beni);font-weight:700;margin-top:2px">${esc(it.deadline)} 截止</div>
      </div></div>
    <div class="between" style="margin-top:9px">
      <div style="flex:1;margin-right:12px">
        <div class="between tiny dim"><span>${it.left?`剩 ${it.left} 份`:"已搶完"}</span><span>${it.qty-it.left} / ${it.qty}</span></div>
        <div class="stockbar"><i style="width:${pct}%;background:${it.left?"var(--gold)":"var(--beni)"}"></i></div></div>
      ${it.left===0
        ? `<button class="btn ${wl?"quiet":"danger"} sm" onclick="waitlist('${it.no}')">${wl?"✓ 候補中":"排候補"}</button>`
        : got ? `<div class="qty"><button onclick="qtyK('L${it.no}',-1)">−</button><span>${got}</span><button onclick="qtyK('L${it.no}',1)">＋</button></div>`

function orderPhoto(){
  openSheet("拍照下單",`
    <p class="sm" style="color:var(--ink-2);margin-top:0;line-height:1.8">
      拍商品本體或價格標籤都可以。系統會辨識品名與日幣「税込価格」，再對照價目表換算台幣售價。</p>
    <label class="drop" style="display:block;cursor:pointer;margin-top:12px">
      <b>選擇商品照片</b><div class="tiny dim">一張照片可辨識多件商品<br>JPG／PNG／HEIC・單張 10MB 以內</div>
      <input type="file" accept="image/*" style="display:none" onchange="onOrderPhoto(event)"></label>
    <div id="ocrzone"></div>`);
}
async function onOrderPhoto(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  const err=checkFile(f); if(err){ toast(err); ev.target.value=""; return; }
  const name=sysName("image",f);
  const r=new FileReader();
  r.onload=async e=>{
    $("#ocrzone").innerHTML=`<div class="row" style="margin-top:12px;align-items:flex-start">
      <img class="zoomable" src="${e.target.result}" onclick="lightbox('img',this.src,'商品照片')"
        style="width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">
      <div style="flex:1;min-width:0">
        <div class="tiny" id="ocrmsg"><span class="spin"></span> 上傳中…</div></div></div>
      ${upInfo("image",f,name)}`;
    if(!CFG.mock) return uploadOrderPhoto(f,name);
    await wait(700);
    $("#ocrmsg").innerHTML=`<span class="spin"></span> 辨識商品中…`;
    await wait(1800);
    const m=$("#ocrmsg"); if(m) m.innerHTML=`<span class="spin"></span> 讀取價格標籤…`;
    await wait(1500);
    const pool=[["SLAP SLIP 恐竜コラボ Tシャツ","恐龍圖鑑變色童裝",2200,"high","尺寸 100・遇水會變色"],
                ["デニムパンツ","EDWIN 牛仔褲",2860,"high","尺寸 100・40% OFF"],
                ["ベビーソックス 3足組","嬰兒襪三足組",979,"medium","尺寸 15~20cm"],
                ["","橘色短袖上衣",null,"low","吊牌標 30% OFF，折後價看不清楚"]];
    const g=pool[Math.floor(Math.random()*pool.length)];
    const imgLine={k:"I"+Date.now(),src:"image",ref:name,n:g[1],nja:g[0],e:"🖼️",
      jpy:g[2],p:g[2]?twdOf(g[2]):null,q:1,max:99,conf:g[3],img:e.target.result,
      file:name,origName:f.name,st:"pending",note:g[4]};
    S.cart.push(imgLine); syncBadge(true);
    API.cartAddImage({file_name:name,orig_name:f.name,mime:f.type,data:e.target.result})
      .then(r=>{ if(r&&r.cart_id){ imgLine.cid=r.cart_id;
        if(!CFG.mock){ Object.assign(imgLine,{n:r.name,nja:r.name_ja||"",jpy:r.jpy_taxed,p:r.price_twd,conf:r.ai_confidence,note:r.note||""});
          if(r.ocr_done===false||(r.ocr_done==null&&r.price_twd==null)) pollOcr(r.cart_id,imgLine); }
        render(); } })
      .catch(()=>{ S.cart=S.cart.filter(x=>x!==imgLine); syncBadge(); render(); });
    const m2=$("#ocrmsg"); if(m2) m2.innerHTML=`<span style="color:var(--pine);font-weight:700">✓ 辨識完成</span>`;
    await wait(700); closeSheet(); go("cart");
    toast(g[3]==="high"?"已辨識，請確認後送出":"辨識信心不高，請檢查內容",2600);
  };
  r.readAsDataURL(f);
}

/* 正式模式的拍照下單：壓縮 → 上傳 → 放進購物車，辨識由後端做，前台輪詢結果。
   不顯示任何猜測的品名或價格。 */
async function uploadOrderPhoto(f,name){
  const msg=t=>{ const m=$("#ocrmsg"); if(m) m.innerHTML=t; };
  let data;
  try{ data=await shrinkImage(f); }
  catch(e){ msg(`<span style="color:var(--beni)">${esc(e.message)}</span>`); return; }
  try{
    const r=await API.cartAddImage({file_name:jpgName(name),orig_name:f.name,mime:"image/jpeg",data});
    const l=M.cart(r); if(!l.img) l.img=data;
    S.cart.push(l); syncBadge(true);
    const waiting = r.ocr_done===false || (r.ocr_done==null&&r.price_twd==null);
    if(waiting) pollOcr(r.cart_id,l);
    closeSheet(); go("cart");
    toast(waiting?"照片已送出，辨識約需 1–2 分鐘，完成會自動更新":"已辨識，請確認後送出",2800);
  }catch(e){ msg(`<span style="color:var(--beni)">上傳失敗，請再試一次</span>`); }
}

function submitText(){

    .catch(()=>{ S.cart=S.cart.filter(x=>x.k!==line.k); syncBadge(); render(); });

function confirmLine(k){
  const l=S.cart.find(x=>x.k===k); if(!l)return;

function confirmAll(){
  const done=S.cart.filter(l=>l.st==="pending"); done.forEach(l=>{ l.st="confirmed"; });
  render(); toast(`已確認 ${done.length} 筆`);

  if(ids.length) API.cartConfirm(ids).catch(()=>{ done.forEach(l=>{ l.st="pending"; }); render(); });

function editLine(k){
  const l=S.cart.find(x=>x.k===k); if(!l)return;
  openSheet("修改內容",`

function saveLine(k){

  l.n=n; l.jpy=parseInt($("#ej").value||"0",10)||null; l.p=l.jpy?twdOf(l.jpy):null;

        發票：${esc(o.inv)}${o.note?`<br>備註：${esc(o.note)}`:""}

/* ---------- 拆單申請（對應 orders.split_shipped） ---------- */
function splitAsk(oid){
  const o=DB.orders.find(x=>x.id===oid);
  const arr=o.items.filter(i=>i.ist==="已到貨"), pen=o.items.filter(i=>i.ist!=="已到貨");
  if(o.split_shipped){
    o.split_shipped=false; o.splits=null; render(); toast("已取消先出貨申請，會等齊了一起寄");
    API.splitRequest(oid,false).catch(()=>{ o.split_shipped=true; render(); }); return;
  }
  openSheet("申請先出貨",`
    <div class="alert pine" style="margin-top:0">已到貨 <b>${arr.length}</b> 項可先寄，另 <b>${pen.length}</b> 項還在日本採買。</div>
    <div class="h2" style="margin:16px 0 8px">先寄這些</div>
    <div class="list">${arr.map(i=>`<div class="item"><div class="ph">${i.e}</div>
      <div class="info"><b>${esc(i.n)}</b><div class="tiny dim">× ${i.q}</div></div>
      <span class="pill pine" style="align-self:center">已到貨</span></div>`).join("")}</div>
    <div class="h2" style="margin:16px 0 8px">這些等下一批</div>
    <div class="list">${pen.map(i=>`<div class="item"><div class="ph">${i.e}</div>
      <div class="info"><b>${esc(i.n)}</b><div class="tiny dim">× ${i.q}</div></div>
      <span class="pill grey" style="align-self:center">${i.ist}</span></div>`).join("")}</div>
    <div class="sm" style="color:var(--ink-2);line-height:1.9;margin-top:14px">
      ・台灣端運費仍<b>只收一次</b>，不因拆單重複計費<br>
      ・第二批的國際運費依實際材積另計<br>
      ・申請後會通知小幫手安排，出貨時推播追蹤號碼</div>`,
    `<button class="btn primary block" onclick="doSplit('${oid}')">確認申請先出貨</button>`);
}
function doSplit(oid){
  const o=DB.orders.find(x=>x.id===oid);
  if(!CFG.mock){                                   // 子單與追蹤號碼由後端安排，不在前台編
    closeSheet();
    API.splitRequest(oid,true).then(async()=>{
      o.split_shipped=true; render(); toast("已送出先出貨申請，小幫手會收到通知",2600);
      try{ DB.orders=(await API.orderList()).map(M.order); render(); }catch(_){}
    }).catch(()=>{});
    return;
  }
  const arr=o.items.filter(i=>i.ist==="已到貨"), pen=o.items.filter(i=>i.ist!=="已到貨");
  o.split_shipped=true;
  o.splits=[
    {no:"子單 1／2",items:arr.map(i=>`${i.n.slice(0,10)} ×${i.q}`).join("、"),
     carrier:"cvs711",no2:String(88200000000+Math.floor(Math.random()*8e7)),
     eta:"已申請・待小幫手安排出貨",step:0,trace:[[now(),"賣家已出貨","日本集貨倉"]]},
    {no:"子單 2／2",items:pen.map(i=>`${i.n.slice(0,10)} ×${i.q}`).join("、"),
     carrier:null,no2:null,eta:"待剩餘品項到貨後出貨",step:-1,trace:[]}];
  closeSheet(); render(); toast("已送出先出貨申請，小幫手會收到通知",2600);
  API.splitRequest(oid,true).catch(()=>{ o.split_shipped=false; o.splits=null; render(); });
}
function confirmGot(oid){
  const o=DB.orders.find(x=>x.id===oid);
  const prev=o.st; o.st=4; o.log[4]=now(); render(); toast("已回報收到，謝謝！");
  API.received(oid).catch(()=>{ o.st=prev; render(); });
}

function payStmt(sid){
  S._sid=sid;
  const t=DB.stmts.find(x=>x.id===sid);
  S.payway=S.payway||"credit";
  openSheet("付款　"+sid,`
    <div class="sumbox" style="margin-top:0">
      <div class="sumrow total" style="border-top:none;margin:0;padding:0">
        <span>應付金額</span><span>NT$${nf(t.total)}</span></div>
      <div class="sumrow" style="padding-top:8px"><span>包含訂單</span><span>${t.orders.length} 筆</span></div>
      <div class="sumrow"><span>付款期限</span><span>收到後 ${SHOP.payDeadlineDays} 天內</span></div></div>

    <div class="h2" style="margin:18px 0 8px">選擇付款方式</div>
    ${Object.entries(PAYWAY).map(([k,w])=>`
      <button class="payopt ${S.payway===k?"on":""}" onclick="setPayway('${k}')">
        <span class="pe">${w.e}</span>
        <span style="flex:1;text-align:left"><b>${w.t}</b><br><span class="tiny dim">${w.d}</span></span>
        <span class="radio ${S.payway===k?"on":""}"></span></button>`).join("")}

    <div class="h2" style="margin:18px 0 8px">發票</div>
    <div class="sumbox">
      <div class="sumrow"><span>開立方式</span><span>${S.inv==="carrier"?"手機載具 "+esc(DB.me.carrier)
        :S.inv==="donate"?"捐贈發票":"統一編號 "+esc(S.taxId||"未填")}</span></div>
      <div class="sumrow"><span>開立時機</span><span>付款成功後自動開立</span></div></div>
    <button class="link" style="margin-top:8px" onclick="closeSheet();go('cart')">要改發票設定，到購物車調整</button>

    <div id="payzone"></div>`,
    `<button class="btn primary block" onclick="doPay('${sid}')">
      ${S.payway==="bank"?"顯示匯款資訊":"前往付款 NT$"+nf(t.total)}</button>`);
}
function setPayway(k){ S.payway=k; if(S._sid) payStmt(S._sid); }
async function doPay(sid){
  const t=DB.stmts.find(x=>x.id===sid), w=S.payway;
  let r;
  try{ r=await API.payInit(sid,w,{type:S.inv,carrier:DB.me.carrier,tax_id:S.taxId}); }
  catch(e){ return; }
  t.payway=w;
  if(w==="bank"){
    $("#payzone").innerHTML=`
      <div class="alert pine" style="margin-top:14px">
        ${SHOP.bankAccount?`${SHOP.bankName}（${SHOP.bankCode}）　<span class="code">${SHOP.bankAccount}</span>
        <button class="link" style="margin-left:6px" onclick="copyText('${jsq(SHOP.bankAccount)}','帳號')">複製</button><br>`
        :`<b>匯款帳號暫時無法顯示</b>，請改用信用卡或 ATM，或從「我的 → 轉接客服」向小幫手索取。<br>`}
        ${SHOP.bankHolder?`戶名 ${esc(SHOP.bankHolder)}・`:""}金額 NT$${nf(t.total)}</div>
      <div class="field" style="margin-top:12px"><label>轉出帳號後五碼</label>
        <input id="l5" maxlength="5" inputmode="numeric" placeholder="例如 31007"></div>
      <button class="btn primary block" onclick="submitFive('${sid}')">送出後五碼</button>
      ${CFG.mock?`<label class="drop" style="display:block;cursor:pointer;margin-top:10px">
        <b>或上傳轉帳截圖</b><div class="tiny dim">系統自動辨識金額與後五碼</div>
        <input type="file" accept="image/*" style="display:none" onchange="onStmtFile(event,'${sid}')"></label>`:""}`;
    return;
  }
  if(w==="atm"){
    t.vacc=r.vacc; t.vaccBank=r.bank; t.vaccDue=r.due; t.pay="待官方確認";
    $("#payzone").innerHTML=`
      <div class="alert gold" style="margin-top:14px">
        <b>專屬繳費帳號已產生</b><br>
        ${esc(r.bank)}　<span class="code" style="font-size:15px;font-weight:900">${r.vacc}</span>
        <button class="link" style="margin-left:6px" onclick="copyText('${r.vacc}','繳費帳號')">複製</button><br>
        金額 NT$${nf(t.total)}・請於 ${esc(r.due)} 完成轉帳<br>
        <span class="tiny">此帳號僅供本次付款使用，繳費後系統自動核對，不需回報後五碼。</span></div>`;
    render(); toast("繳費帳號已產生，也會推播到你的聊天室",2800);
    echoToChat(`🏧 ${sid} 繳費帳號　${r.bank} ${r.vacc}　NT$${nf(t.total)}　${r.due}內完成`);
    return;
  }
  /* 信用卡 / LINE Pay：導轉到金流頁 */
  $("#payzone").innerHTML=`<div class="alert pine" style="margin-top:14px">
    <span class="spin"></span> 正在前往${PAYWAY[w].t}付款頁…</div>`;
  await wait(1200);
  if(CFG.mock){                                  // 原型模式直接模擬付款成功
    t.pay="已核對"; t.paidAt=now(); t.tradeNo=r.tradeNo;
    t.orders.forEach(oid=>{const o=DB.orders.find(x=>x.id===oid); if(o)o.pay="已核對";});
    const iv=mockInvoice();
    t.inv={st:iv.st,no:iv.no,date:iv.date,carrier:iv.carrier,amount:t.total};
    closeSheet(); render();
    toast(`付款成功，發票 ${iv.no} 已開立`,3000);
    echoToChat(`✅ ${sid} 付款完成　NT$${nf(t.total)}　發票 ${iv.no}`);
  }else{
    postForm(r.redirect,r.fields);               // 正式版以表單 POST 導向綠界
  }
}
/* 銀行轉帳：回報後五碼 → 待官方確認（由後端比對入帳） */
function submitFive(sid){
  const v=($("#l5")&&$("#l5").value.trim())||"";
  if(!/^\d{5}$/.test(v)){ toast("請輸入 5 碼數字"); return; }
  const t=DB.stmts.find(x=>x.id===sid); const prev={pay:t.pay,last5:t.last5,payway:t.payway};
  t.last5=v; t.pay="待官方確認"; t.payway="bank";
  closeSheet(); render(); toast("已回報，核對完成後會通知你",2600);
  API.reportTransfer(sid,v).catch(()=>{ Object.assign(t,prev); render(); });
}
function onStmtFile(ev,sid){
  const f=ev.target.files&&ev.target.files[0]; if(!f)return;
  const err=checkFile(f); if(err){ toast(err); ev.target.value=""; return; }
  const name=sysName("payment",f);
  const t=DB.stmts.find(x=>x.id===sid), r=new FileReader();
  r.onload=async e=>{
    const l5=($("#l5")&&$("#l5").value.trim())||String(Math.floor(10000+Math.random()*89999));
    $("#payzone").innerHTML=`<div class="row" style="margin-top:12px;align-items:flex-start">
      <img class="zoomable" src="${e.target.result}" onclick="lightbox('img',this.src,'轉帳截圖')"
        style="width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">
      <div style="flex:1;min-width:0">
        <div class="tiny" id="ocrmsg"><span class="spin"></span> 上傳中…</div></div></div>
      ${upInfo("payment",f,name)}`;
    await wait(700);
    $("#ocrmsg").innerHTML=`<span class="spin"></span> 辨識中…`;
    await wait(1500);
    $("#ocrmsg").innerHTML=`<span class="spin"></span> 比對金額 NT$${nf(t.total)}…`;
    await wait(1300);
    $("#ocrmsg").innerHTML=`<span style="color:var(--pine);font-weight:700">✓ 核對成功・後五碼 ${l5}</span>`;
    t.last5=l5; t.pay="已核對"; t.paidAt=now(); t.img=e.target.result; t.file=name;
    t.orders.forEach(oid=>{const o=DB.orders.find(x=>x.id===oid); if(o)o.pay="已核對";});
    await wait(900); closeSheet(); render(); toast("付款已核對完成",2600);
  };
  r.readAsDataURL(f);
}

/* 複製帳號／繳費帳號：先用剪貼簿 API，LINE 內建瀏覽器不支援時改用選取複製 */
async function copyText(text,label){
  const done=()=>toast("已複製"+(label||"")+"："+text,2200);
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(String(text)); return done(); } }catch(e){}
  try{
    const t=document.createElement("textarea"); t.value=String(text); t.setAttribute("readonly","");
    t.style.cssText="position:fixed;top:-1000px;opacity:0"; document.body.appendChild(t);
    t.select(); t.setSelectionRange(0,t.value.length);
    const ok=document.execCommand("copy"); t.remove();
    if(ok) return done();
  }catch(e){}
  toast((label||"")+" "+text+"（請長按手動複製）",3200);
}

/* ---------- 電腦版：底部分頁列 ↔ 頂部導覽 ---------- */
const DESKTOP=(window.matchMedia&&window.matchMedia("(min-width:860px)"))||{matches:false};  // 舊版瀏覽器沒有 matchMedia 時當手機版
function placeNav(){
  const nav=$(".tabs"), top=$("#topbar"), brand=top&&top.querySelector(".brand"), view=$("#view");
  if(!nav||!top||!brand||!view) return;
  if(DESKTOP.matches){ if(nav.parentNode!==top) brand.after(nav); }
  else if(nav.previousElementSibling!==view){ view.after(nav); }
}
if(DESKTOP.addEventListener) DESKTOP.addEventListener("change",placeNav); else if(DESKTOP.addListener) DESKTOP.addListener(placeNav);

/* ---------- Render ---------- */
function render(){
  $("#view").dataset.tab=S.tab; placeNav();
  $("#view").innerHTML={home:vHome,live:vLive,wish:vWish,cart:vCart,orders:vOrders,me:vMe}[S.tab]();
